<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartSlate — Digital Learning Operating System</title>
    
    <!-- CSS Design System -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/notebook.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- Offline Banner -->
    <div id="offline-banner" class="offline-banner" style="display: none;">
        <svg class="icon-svg"><use href="#icon-wifi-off"/></svg>
        <span>Working Offline — Unsaved changes will sync automatically when Wi-Fi re-connects.</span>
    </div>

    <!-- Inline SVG Icon Collection (Start Universal Tiny Oval Icons) -->
    <svg style="display: none;">
        <defs>
            <g id="icon-book">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-assignment">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-chat">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-exam">
                <path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-search">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-attendance">
                <rect x="3" y="4" width="18" height="18" rx="3" ry="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-bell">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-settings">
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" fill="none"/>
            </g>
            <g id="icon-user">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
            </g>
            <g id="icon-share">
                <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2"/>
            </g>
            <g id="icon-plus">
                <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-history">
                <polyline points="12 8 12 12 14 14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-logout">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-menu">
                <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-wifi-off">
                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                <line x1="12" y1="20" x2="12.01" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-check">
                <polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-x">
                <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-pen">
                <path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-trash">
                <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-chevron-left">
                <polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-chevron-right">
                <polyline points="9 18 15 12 9 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-home">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </defs>
    </svg>

    <!-- Splash / Loading Screen -->
    <div id="loading-screen">
        <div class="splash-logo-container">
            <div class="splash-icon">
                <svg class="icon-svg icon-svg-xl"><use href="#icon-book"/></svg>
            </div>
            <div class="splash-title">SmartSlate</div>
        </div>
        <div class="spinner"></div>
        <p style="margin-top: 16px; color: var(--text-secondary); font-weight: 600;">Initializing Digital OS...</p>
    </div>

    <div id="app">
        <!-- Glass Navigation Bar -->
        <header id="top-navbar" class="glass-panel top-navbar" style="display: none;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="glass-btn glass-btn-icon" id="btn-mobile-menu" title="Menu" style="display: none;">
                    <svg class="icon-svg"><use href="#icon-menu"/></svg>
                </button>
                <div class="nav-brand" id="nav-brand">
                    <div class="nav-logo-icon">
                        <svg class="icon-svg"><use href="#icon-book"/></svg>
                    </div>
                    <span>SmartSlate</span>
                </div>
            </div>

            <!-- Role Specific Nav Items -->
            <nav class="nav-links" id="nav-dynamic-links"></nav>

            <!-- Controls (Notifications, User Profile, Settings) -->
            <div class="nav-user-controls">
                <!-- Notifications Bell Dropdown -->
                <div class="notif-dropdown-wrapper">
                    <button class="glass-btn glass-btn-icon" id="btn-notif-bell" title="Notifications">
                        <svg class="icon-svg"><use href="#icon-bell"/></svg>
                        <span id="notif-badge-count" class="glass-badge glass-badge-danger" style="display: none; position: absolute; top: -4px; right: -4px; font-size: 11px; padding: 2px 6px;">0</span>
                    </button>

                    <div class="notif-panel" id="notif-panel">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);">
                            <span style="font-weight: 700;">Notifications</span>
                            <button class="glass-btn glass-btn-sm" id="btn-mark-all-read">Mark all read</button>
                        </div>
                        <div id="notif-list-container">
                            <p style="text-align: center; color: var(--text-muted); padding: 20px;">No notifications yet.</p>
                        </div>
                    </div>
                </div>

                <!-- User Profile & Role Tag -->
                <div id="user-profile-badge" class="glass-badge glass-badge-accent" style="padding: 6px 14px; gap: 8px; cursor: pointer;">
                    <svg class="icon-svg"><use href="#icon-user"/></svg>
                    <span id="user-display-name">User</span>
                </div>

                <!-- Settings -->
                <button class="glass-btn glass-btn-icon" id="btn-open-settings" title="Settings">
                    <svg class="icon-svg"><use href="#icon-settings"/></svg>
                </button>
            </div>
        </header>

        <!-- Mobile Side Drawer Navigation Overlay -->
        <div id="mobile-drawer-overlay" class="mobile-drawer-overlay">
            <div class="mobile-drawer">
                <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
                    <div style="display: flex; align-items: center; gap: 8px; font-weight: 800;">
                        <svg class="icon-svg" style="color: var(--accent-primary);"><use href="#icon-book"/></svg>
                        <span>SmartSlate Navigation</span>
                    </div>
                    <button class="glass-btn glass-btn-icon" id="btn-close-drawer" style="min-width: 36px; min-height: 36px; padding: 4px;">
                        <svg class="icon-svg"><use href="#icon-x"/></svg>
                    </button>
                </div>
                <div id="drawer-links-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
        </div>

        <!-- Main View Container Shell -->
        <main class="view-container">
            <!-- 1. Auth View (Login / Signup) -->
            <div id="view-auth" class="view-section" style="display: none;"></div>

            <!-- 2. Student Dashboard -->
            <div id="view-student" class="view-section" style="display: none;"></div>

            <!-- 3. Teacher Dashboard -->
            <div id="view-teacher" class="view-section" style="display: none;"></div>

            <!-- 4. Parent Dashboard -->
            <div id="view-parent" class="view-section" style="display: none;"></div>

            <!-- 5. Settings View -->
            <div id="view-settings" class="view-section" style="display: none;"></div>
        </main>

        <!-- Bottom Navigation Bar for Mobile / Touch Tablets -->
        <div id="bottom-nav-bar" class="bottom-nav-bar"></div>
    </div>

    <!-- Dynamic Modals Container -->
    <div id="modal-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- JavaScript Dependencies -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/socket.js"></script>
    
    <!-- View & Component Modules -->
    <script src="/js/views/authView.js"></script>
    <script src="/js/views/studentView.js"></script>
    <script src="/js/views/teacherView.js"></script>
    <script src="/js/views/parentView.js"></script>
    <script src="/js/views/settingsView.js"></script>

    <!-- Main SPA Application Router & Dispatcher -->
    <script src="/js/app.js"></script>
</body>
</html>
